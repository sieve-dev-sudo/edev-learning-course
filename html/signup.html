        <input type="text" id="fullname" placeholder=" " required>
      </div>
      <div class="field">
        <label for="suemail">Enter Email Here</label>
        <input type="email" id="suemail" placeholder=" " required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="supassword">Enter Password Here</label>
          <input type="password" id="supassword" placeholder=" " required>
        </div>
        <div class="field">
          <label for="suconfirm">Confirm Password</label>
          <input type="password" id="suconfirm" placeholder=" " required>
        </div>
      </div>
      <button type="submit" class="login-btn">Sign Up</button>
    </form>
